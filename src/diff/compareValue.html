<meta charset='UTF-8'/>
<script type='module'>
    import focus from '../../scripts/focus/focus.js';
    import compareValue from './compareValue.js';

    const TESTS = [
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'no change',
            input: {
                a: 'foo',
                b: 'foo',
            },
            output: 'foo',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'some-none',
            input: {
                a: 'foo',
                b: undefined,
            },
            output: '❮foo▸❯',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'none-some',
            input: {
                a: undefined,
                b: 'foo',
            },
            output: '❮▸foo❯',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'added',
            input: {
                a: 'foo',
                b: 'fobaro',
            },
            output: '❮foo▸fobaro❯',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'removed',
            input: {
                a: 'fobaro',
                b: 'foo',
            },
            output: '❮fobaro▸foo❯',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'changed',
            input: {
                a: 'f o n',
                b: 'f xy n',
            },
            output: 'f ❮o▸xy❯ n',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'multiple',
            input: {
                a: 'f1 f2 f3',
                b: 'f f24 f5',
            },
            output: '❮f1▸f❯ ❮f2▸f24❯ ❮f3▸f5❯',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'numeric',
            input: {
                a: 'foo 10% bar',
                b: 'foo 20% bar',
            },
            output: 'foo ❮10▸20❯% bar',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'chinese',
            input: {
                a: '我喜欢写代码',
                b: '我喜欢看代码',
            },
            output: '我喜欢❮写▸看❯代码',
        },
    ];

    await focus(compareValue, TESTS, {
        sendInputAsArguments: true
    });
</script>
