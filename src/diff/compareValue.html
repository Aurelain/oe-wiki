<meta charset='UTF-8'/>
<script type='module'>
    import focus from '../../scripts/focus/focus.js';
    import compareValue from './compareValue.js';

    const TESTS = [
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'some-none',
            input: {
                a: 'foo',
                b: undefined,
            },
            output: '❮foo▸❯',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'none-some',
            input: {
                a: undefined,
                b: 'foo',
            },
            output: '❮▸foo❯',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'added',
            input: {
                a: 'foo',
                b: 'fobaro',
            },
            output: 'fo❮▸bar❯o',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'removed',
            input: {
                a: 'fobaro',
                b: 'foo',
            },
            output: 'fo❮bar▸❯o',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'changed',
            input: {
                a: 'fon',
                b: 'fxyn',
            },
            output: 'f❮o▸xy❯n',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'multiple',
            input: {
                a: 'f1 f2 f3',
                b: 'f f24 f5',
            },
            output: 'f❮1▸❯ f2❮▸4❯ f❮3▸5❯',
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'numeric',
            input: {
                a: 'foo 10% bar',
                b: 'foo 20% bar',
            },
            output: 'foo ❮10%▸20%❯ bar',
        },
    ];

    await focus(compareValue, TESTS);
</script>
