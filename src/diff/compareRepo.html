<meta charset='UTF-8'/>
<script type='module'>
    import focus from '../../scripts/focus/focus.js';
    import compareRepo from './compareRepo.js';

    const TESTS = [
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'none-none',
            input: {
                a: {},
                b: {},
            },
            output: {},
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'some-none',
            input: {
                a: {
                    general: {
                        foo: {nr: 5}
                    }
                },
                b: {},
            },
            output: {
                general: [
                    {id: 'foo', summary: 'REMOVED'},
                ]
            },
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'none-some',
            input: {
                a: {},
                b: {
                    general: {
                        foo: {nr: 5}
                    }
                },
            },
            output: {
                general: [
                    {id: 'foo', summary: 'ADDED'},
                ]
            },
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'mixed',
            input: {
                a: {
                    general: {
                        foo: {nr: 5,}
                    },
                    en: {
                        foo: {name: 'Foo5En',}
                    },
                    fr: {
                        foo: {name: 'Foo5Fr',}
                    }
                },
                b: {
                    general: {
                        foo: {nr: 6,}
                    },
                    en: {
                        foo: {name: 'Foo6En',}
                    },
                    fr: {
                        foo: {name: 'Foo6Fr',}
                    }
                },
            },
            output: {
                general: [
                    {id: 'foo', field: 'nr', summary: '❮5▸6❯'},
                ],
                en: [
                    {id: 'foo', field: 'name', summary: '❮Foo5En▸Foo6En❯', lang:'en'},
                ],
                fr: [
                    {id: 'foo', field: 'name', summary: '❮Foo5Fr▸Foo6Fr❯', lang:'fr'},
                ]
            }
        },
    ];

    await focus(compareRepo, TESTS, {sendInputAsArguments: true});
</script>
