<meta charset='UTF-8'/>
<script type='module'>
    import focus from '../../scripts/focus/focus.js';
    import compareHub from './compareHub.js';

    const TESTS = [
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'no change',
            input: {
                a: {
                    foo: {nr: 5,},
                },
                b: {
                    foo: {nr: 5,}
                },
            },
            output: [],
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'none-none',
            input: {
                a: {},
                b: {},
            },
            output: [],
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'some-none',
            input: {
                a: {
                    foo: {nr: 5,},
                },
                b: {},
            },
            output: [
                {id: 'foo', field: 'nr', summary: '❮5▸❯'}
            ],
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'none-some',
            input: {
                a: {},
                b: {
                    foo: {nr: 5},
                },
            },
            output: [
                {id: 'foo', field: 'nr', summary: '❮▸5❯'}
            ],
        },
        // -------------------------------------------------------------------------------------------------------------
        {
            name: 'mixed',
            input: {
                a: {
                    foo: {name: 'f1 f2 f3', description: 'hi',},
                    rem: {nr: 0,}
                },
                b: {
                    foo: {name: 'f f24 f5', description: 'hello',},
                    add: {nr: 1,}
                },
            },
            output: [
                {id: 'foo', field: 'name', summary: '❮f1▸f❯ ❮f2▸f24❯ ❮f3▸f5❯'},
                {id: 'foo', field: 'description', summary: '❮hi▸hello❯'},
                {id: 'rem', field: 'nr', summary: '❮0▸❯'},
                {id: 'add', field: 'nr', summary: '❮▸1❯'},
            ]
        },
    ];

    await focus(compareHub, TESTS, {
        sendInputAsArguments: true,
    });
</script>
